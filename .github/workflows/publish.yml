# Releases the CLI on every push to main that changes what it ships, and publishes it on npm. The
# version is the last one (npm or a tag), increased by a patch. Run it by hand (Actions >
# Publish > Run workflow) to choose a minor or a major increment.
#
# The version is never committed: npm and the tag v<version> hold it. package.json keeps 0.0.0.
#
# npm trusts this workflow by its file name (Trusted Publishing, OIDC; no NPM_TOKEN): renaming
# publish.yml stops publishing until the package's Trusted Publisher on npmjs.com is updated.
#
# No person approves a version: what guards the release is that only main can publish. main takes
# changes through pull requests only (a ruleset of the repository), and the environment `npm`
# accepts a deployment from main only.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'README.md'
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment'
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      # The tag and the GitHub release.
      contents: write
      # The OIDC token npm exchanges for publishing, and that signs the provenance of each version.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # npm trusted publishing needs npm >= 11.5.1, which Node 22 does not ship. No registry-url:
      # it writes an _authToken line npm would use instead of OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # After setup-node, and without its own Node: either order or a second Node breaks OIDC.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          install: false
          node-version-file: false
      - run: npm install -g npm@11.15.0
      - run: pnpm install --frozen-lockfile

      - name: Choose the version
        id: version
        env:
          INCREMENT: ${{ inputs.increment || 'patch' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          name=$(jq -r .name package.json)
          current=$(npm view "$name" version)
          tagged=$(git tag -l 'v*' | sed 's/^v//' | { grep -v -- '-' || true; } | sort -V | tail -1)
          if [ -n "$tagged" ] && [ "$(printf '%s\n%s\n' "$current" "$tagged" | sort -V | tail -1)" = "$tagged" ]; then current=$tagged; fi
          echo "last version: $name@$current"
          if [ "$MANUAL" != true ] && git rev-parse -q --verify "refs/tags/v$current" >/dev/null \
              && git diff --quiet "v$current" HEAD -- src tsconfig.json package.json pnpm-lock.yaml README.md; then
            echo "Nothing changed since v$current."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(npx -y semver@7.7.3 -i "$INCREMENT" "$current")
          echo "$current -> $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        run: pnpm check && pnpm build && pnpm test

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public --provenance
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --verify-tag
